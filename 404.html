<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Oops! Wrong Aisle | STACKLY Organic Grocery</title>
  <meta name="description" content="Oops! Wrong Aisle. It looks like you've wandered into an uncharted aisle of our organic grocery. The fresh harvest or page you're looking for doesn't exist or has rolled off the shelf.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2314B8A6'/><text y='.75em' x='.2em' font-size='65' fill='white'>🥬</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS files -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Preload Assets -->
  <link rel="preload" href="assets/images/logo.webp" as="image" type="image/webp">
  <link rel="preload" href="assets/images/404-grocery-basket.webp" as="image" type="image/webp">
</head>
<body class="error-page-body preloader-active">

  <!-- ==========================================================================
       LOGO INTRO & WAVE PRELOADER (Unified across all pages)
       ========================================================================== -->
  <div id="logoIntroPreloader" aria-hidden="true">
    <div class="preloader-brand-wrap">
      <div class="preloader-logo-wrapper">
        <img src="assets/images/logo.webp" alt="STACKLY Organic Grocery" class="preloader-logo-img" width="280" height="82">
      </div>
      <!-- Wave Loading Animation below Logo -->
      <div class="preloader-wave-container" aria-label="Loading...">
        <div class="wave-bars">
          <span class="wave-bar bar-1"></span>
          <span class="wave-bar bar-2"></span>
          <span class="wave-bar bar-3"></span>
          <span class="wave-bar bar-4"></span>
          <span class="wave-bar bar-5"></span>
          <span class="wave-bar bar-6"></span>
          <span class="wave-bar bar-7"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       MAIN 404 SECTION (Previous UI with Grocery Basket Image Background)
       ========================================================================== -->
  <main class="ref-404-container" id="main-content">

    <!-- Background Image Layer (Grocery Basket) -->
    <div class="ref-404-bg-image" aria-hidden="true"></div>

    <!-- Soft Ambient Radial Aura & Vignette for Perfect Contrast -->
    <div class="ref-404-glow" aria-hidden="true"></div>
    <div class="ref-404-overlay" aria-hidden="true"></div>

    <!-- Centered Previous UI Content -->
    <div class="ref-404-content">
      <!-- Big Glowing Gradient 404 in STACKLY Brand Colors -->
      <div class="ref-404-digits-wrap">
        <div class="ref-404-digits" aria-label="404 Error">404</div>
      </div>

      <!-- Headline -->
      <h1 class="ref-404-title">Oops! Wrong Aisle.</h1>

      <!-- Description Text -->
      <p class="ref-404-desc">
        It looks like you've wandered into an uncharted aisle of our organic grocery store. The fresh item or page you're looking for doesn't exist or has rolled off the shelf.
      </p>

      <!-- Action Buttons -->
      <div class="ref-404-actions">
        <!-- Go Back Button (Outline Pill) -->
        <button type="button" class="ref-btn-back" id="refBtnBack" onclick="handleGoBack()" aria-label="Go Back to previous page">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          <span>Go Back</span>
        </button>

        <!-- Go To Home Button (Solid Teal Glowing Pill) -->
        <a href="index.html" class="ref-btn-home" id="refBtnHome" onclick="handleGoHome(event)" aria-label="Go to STACKLY Homepage">
          <i class="bi bi-house-door" aria-hidden="true"></i>
          <span>GO TO HOME</span>
        </a>
      </div>
    </div>
  </main>

  <!-- Application Scripts -->
  <script src="assets/js/animations.js"></script>

  <!-- Navigation Action Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.StacklyAnimations && typeof window.StacklyAnimations.init === 'function') {
        window.StacklyAnimations.init();
      }
    });

    function handleGoBack() {
      if (window.StacklyAnimations && typeof window.StacklyAnimations.triggerGoBack === 'function') {
        window.StacklyAnimations.triggerGoBack();
      } else if (window.StacklyAnimations && typeof window.StacklyAnimations.triggerPageTransition === 'function') {
        const dest = (document.referrer && document.referrer.includes(window.location.host)) ? document.referrer : 'index.html';
        window.StacklyAnimations.triggerPageTransition(dest);
      } else {
        if (window.history.length > 1) {
          window.history.back();
        } else if (document.referrer && document.referrer.includes(window.location.host)) {
          window.location.href = document.referrer;
        } else {
          window.location.href = 'index.html';
        }
      }
    }

    function handleGoHome(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (window.StacklyAnimations && typeof window.StacklyAnimations.triggerGoHome === 'function') {
        window.StacklyAnimations.triggerGoHome();
      } else {
        sessionStorage.removeItem('stackly_should_restore_scroll');
        sessionStorage.removeItem('stackly_saved_scroll_y');
        sessionStorage.removeItem('stackly_saved_anchor');
        sessionStorage.setItem('stackly_scroll_to_top', 'true');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>

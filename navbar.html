<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar | STACKLY Premium Organic Grocery</title>
  <meta name="description" content="STACKLY Organic Grocery Navigation Bar Component.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2314B8A6'/><text y='.75em' x='.2em' font-size='65' fill='white'>🥬</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

  <!-- Custom CSS files -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Preload Official Brand Logo -->
  <link rel="preload" href="assets/images/logo.webp" as="image" type="image/webp">
</head>
<body style="background: #FFFFFF; margin: 0;">

  <!-- ==========================================================================
       OFFICIAL STACKLY NAVBAR — EXACT MATCH TO REFERENCE IMAGE
       ========================================================================== -->
  <header class="site-header" id="siteHeader">
    <div class="header-container">
      
      <!-- Logo Left (Teal S Spiral + STACKLY) -->
      <a href="index.html" class="brand-logo-link" aria-label="STACKLY Organic Grocery Homepage">
        <img src="assets/images/logo.webp" alt="STACKLY Organic Grocery" class="brand-logo-img" width="145" height="43">
      </a>

      <!-- Center/Right: Navigation Links -->
      <nav class="header-actions" aria-label="Main Navigation">
        <!-- 1. Home Link with House Icon -->
        <a href="index.html" class="nav-text-link" aria-label="Home">
          <i class="bi bi-house"></i>
          <span>Home</span>
        </a>

        <!-- 2. About Us -->
        <a href="about.html" class="nav-text-link" aria-label="About Us">
          <i class="bi bi-info-circle"></i>
          <span>About Us</span>
        </a>

        <!-- 3. Services -->
        <a href="service%20page.html" class="nav-text-link" aria-label="Services">
          <i class="bi bi-gear-wide-connected"></i>
          <span>Services</span>
        </a>

        <!-- 4. Blog -->
        <a href="blog.html" class="nav-text-link" aria-label="Blog">
          <i class="bi bi-journal-text"></i>
          <span>Blog</span>
        </a>

        <!-- 5. Contact -->
        <a href="contact.html" class="nav-text-link" aria-label="Contact">
          <i class="bi bi-telephone"></i>
          <span>Contact</span>
        </a>

        <!-- Right Side: Search Bar -->
        <div class="header-search-wrap" role="search">
          <i class="bi bi-search header-search-icon" aria-hidden="true"></i>
          <input type="text" 
                 id="headerSearchInput" 
                 class="header-search-input" 
                 placeholder="Search groceries..." 
                 aria-label="Search for groceries, snacks, or drinks">
          <button id="searchClearBtn" class="search-clear-btn" aria-label="Clear search">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <!-- Account Link (Login) -->
        <a href="login.html" class="nav-text-link header-account-link" aria-label="Open User Account & Login">
          <i class="bi bi-person-circle"></i>
          <span>Account</span>
        </a>

        <!-- Sign Up Button -->
        <a href="signup.html" class="header-signup-btn d-none d-sm-inline-flex" aria-label="Sign Up">
          <i class="bi bi-person-plus-fill"></i>
          <span>Sign Up</span>
        </a>

        <!-- Cart Button with Teal Badge Count -->
        <button class="nav-cart-btn" 
                data-bs-toggle="offcanvas" 
                data-bs-target="#cartDrawer" 
                aria-controls="cartDrawer" 
                aria-label="Open Shopping Cart">
          <div class="cart-icon-wrapper">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge-count" id="headerCartCountBadge">0</span>
          </div>
        </button>

        <!-- Mobile Hamburger Menu Button -->
        <button class="hamburger-btn" 
                data-bs-toggle="offcanvas" 
                data-bs-target="#mobileMenuDrawer" 
                aria-controls="mobileMenuDrawer" 
                aria-label="Open Navigation Menu">
          <i class="bi bi-list"></i>
        </button>
      </nav>

    </div>
  </header>

  <!-- Bootstrap 5.3 JS for dropdowns -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application Modules -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/interactions.js"></script>
  <script src="assets/js/main.js"></script>

</body>
</html>

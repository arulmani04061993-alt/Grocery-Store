<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar | STACKLY Premium Organic Grocery</title>
  <meta name="description" content="STACKLY Organic Grocery Navigation Bar Component.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2314B8A6'/><text y='.75em' x='.2em' font-size='65' fill='white'>🥬</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS files -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Preload Official Brand Logo -->
  <link rel="preload" href="assets/images/logo.webp" as="image" type="image/webp">
</head>
<body style="background: #FFFFFF; margin: 0;">

  <!-- ==========================================================================
       OFFICIAL STACKLY NAVBAR — EXACT MATCH TO REFERENCE IMAGE
       ========================================================================== -->
  <header class="site-header" id="siteHeader">
    <div class="header-container">
      
      <!-- Logo Left (Teal S Spiral + STACKLY) -->
      <a href="index.html" class="brand-logo-link" aria-label="STACKLY Organic Grocery Homepage">
        <img src="assets/images/logo.webp" alt="STACKLY Organic Grocery" class="brand-logo-img" width="145" height="43">
      </a>

      <!-- Center: Wide Rounded Pill Search Bar -->
      <div class="header-search-wrap" role="search">
        <i class="bi bi-search header-search-icon" aria-hidden="true"></i>
        <input type="text" 
               id="headerSearchInput" 
               class="header-search-input" 
               placeholder="Search for groceries, snacks, or drinks..." 
               aria-label="Search for groceries, snacks, or drinks">
        <button id="searchClearBtn" class="search-clear-btn" aria-label="Clear search">
          <i class="bi bi-x-circle-fill"></i>
        </button>
      </div>

      <!-- Right: Navigation Items Matching Reference Image Exactly -->
      <nav class="header-actions" aria-label="Main Navigation">
        <!-- 1. Home Link with House Icon -->
        <a href="index.html" class="nav-text-link" aria-label="Home">
          <i class="bi bi-house"></i>
          <span>Home</span>
        </a>

        <!-- 2. Categories with Indicator Dot & Dropdown -->
        <div class="dropdown d-none d-lg-block">
          <a href="index.html#categories-section" 
             class="nav-text-link has-indicator dropdown-toggle" 
             role="button" 
             data-bs-toggle="dropdown" 
             aria-expanded="false" 
             aria-label="Categories">
            <span>Categories</span>
          </a>
          <ul class="dropdown-menu border-0 shadow-lg rounded-4 p-2 mt-2">
            <li><a class="dropdown-item rounded-3 py-2" href="index.html?category=fruits"><i class="bi bi-apple text-danger me-2"></i> Fresh Fruits</a></li>
            <li><a class="dropdown-item rounded-3 py-2" href="index.html?category=vegetables"><i class="bi bi-flower1 text-success me-2"></i> Vegetables</a></li>
            <li><a class="dropdown-item rounded-3 py-2" href="index.html?category=dairy"><i class="bi bi-cup-hot text-primary me-2"></i> Dairy &amp; Eggs</a></li>
            <li><a class="dropdown-item rounded-3 py-2" href="index.html?category=bakery"><i class="bi bi-cake2 text-warning me-2"></i> Bakery</a></li>
            <li><a class="dropdown-item rounded-3 py-2" href="index.html?category=meat"><i class="bi bi-egg-fried text-danger me-2"></i> Meat &amp; Fish</a></li>
            <li><a class="dropdown-item rounded-3 py-2" href="index.html?category=snacks"><i class="bi bi-box2-heart text-info me-2"></i> Snacks</a></li>
          </ul>
        </div>

        <!-- 3. Deals with HOT Badge -->
        <a href="index.html#deal-of-the-day" class="nav-text-link d-none d-lg-flex" aria-label="Deals">
          <span>Deals</span>
          <span class="deals-hot-badge">HOT</span>
        </a>

        <!-- 4. Account with User Circle Icon (Navigates to login.html) -->
        <a href="login.html" class="nav-text-link header-account-link" aria-label="Open User Account & Login">
          <i class="bi bi-person-circle"></i>
          <span>Account</span>
        </a>

        <!-- 5. Cart Button with Teal Badge Count -->
        <button class="nav-cart-btn" 
                data-bs-toggle="offcanvas" 
                data-bs-target="#cartDrawer" 
                aria-controls="cartDrawer" 
                aria-label="Open Shopping Cart">
          <div class="cart-icon-wrapper">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge-count" id="headerCartCountBadge">0</span>
          </div>
        </button>

        <!-- Mobile Hamburger Menu Button -->
        <button class="hamburger-btn" 
                data-bs-toggle="offcanvas" 
                data-bs-target="#mobileMenuDrawer" 
                aria-controls="mobileMenuDrawer" 
                aria-label="Open Navigation Menu">
          <i class="bi bi-list"></i>
        </button>
      </nav>

    </div>
  </header>

  <!-- Bootstrap 5.3 JS for dropdowns -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application Modules -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/interactions.js"></script>
  <script src="assets/js/main.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar | STACKLY Premium Organic Grocery</title>
  <meta name="description" content="STACKLY Organic Grocery Navigation Bar Component.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%2314B8A6'/><text y='.75em' x='.2em' font-size='65' fill='white'>🥬</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

  <!-- Custom CSS files -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Preload Official Brand Logo -->
  <link rel="preload" href="assets/images/logo.webp" as="image" type="image/webp">
</head>

<body style="background: #FFFFFF; margin: 0;">

  <!-- ==========================================================================
       OFFICIAL STACKLY NAVBAR — EXACT MATCH TO REFERENCE IMAGE
       ========================================================================== -->
  <header class="site-header" id="siteHeader">
    <div class="header-container">

      <!-- Logo Left (Teal S Spiral + STACKLY) -->
      <a href="index.html" class="brand-logo-link" aria-label="STACKLY Organic Grocery Homepage">
        <img src="assets/images/logo.webp" alt="STACKLY Organic Grocery" class="brand-logo-img" width="145" height="43">
      </a>

      <!-- Center/Right: Navigation Links -->
      <nav class="header-actions" aria-label="Main Navigation">
        <!-- 1. Home Link with House Icon -->
        <a href="index.html" class="nav-text-link" aria-label="Home">
          <i class="bi bi-house"></i>
          <span>Home</span>
        </a>

        <!-- 2. About Us -->
        <a href="about.html" class="nav-text-link" aria-label="About Us">
          <i class="bi bi-info-circle"></i>
          <span>About Us</span>
        </a>

        <!-- 3. Services -->
        <a href="service%20page.html" class="nav-text-link" aria-label="Services">
          <i class="bi bi-gear-wide-connected"></i>
          <span>Services</span>
        </a>

        <!-- 4. Blog -->
        <a href="blog.html" class="nav-text-link" aria-label="Blog">
          <i class="bi bi-journal-text"></i>
          <span>Blog</span>
        </a>

        <!-- 5. Contact -->
        <a href="contact.html" class="nav-text-link" aria-label="Contact">
          <i class="bi bi-telephone"></i>
          <span>Contact</span>
        </a>

        <!-- Right Side: Search Bar -->
        <div class="header-search-wrap" role="search">
          <i class="bi bi-search header-search-icon" aria-hidden="true"></i>
          <input type="text" id="headerSearchInput" class="header-search-input" placeholder="Search groceries..."
            aria-label="Search for groceries, snacks, or drinks">
          <button id="searchClearBtn" class="search-clear-btn" aria-label="Clear search">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <!-- Account Link (Login) -->
        <a href="login.html" class="nav-text-link header-account-link" aria-label="Open User Account & Login">
          <i class="bi bi-person-circle"></i>
          <span>Account</span>
        </a>

        <!-- Sign Up Button -->
        <a href="signup.html" class="header-signup-btn d-none d-sm-inline-flex" aria-label="Sign Up">
          <i class="bi bi-person-plus-fill"></i>
          <span>Sign Up</span>
        </a>

        <!-- Cart Button with Teal Badge Count -->
        <button class="nav-cart-btn" data-bs-toggle="offcanvas" data-bs-target="#cartDrawer" aria-controls="cartDrawer"
          aria-label="Open Shopping Cart">
          <div class="cart-icon-wrapper">
            <i class="bi bi-cart3"></i>
            <span class="cart-badge-count" id="headerCartCountBadge">0</span>
          </div>
        </button>

        <!-- Mobile Hamburger Menu Button -->
        <button class="hamburger-btn" data-bs-toggle="offcanvas" data-bs-target="#mobileMenuDrawer"
          aria-controls="mobileMenuDrawer" aria-label="Open Navigation Menu">
          <i class="bi bi-list"></i>
        </button>
      </nav>

    </div>
  </header>

  <!-- ==========================================================================
       OFFCANVAS: SHOPPING CART DRAWER
       ========================================================================== -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartDrawer" aria-labelledby="cartDrawerLabel"
    style="width: 420px; max-width: 90vw;">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title font-heading fw-bold" id="cartDrawerLabel">
        <i class="bi bi-basket2-fill text-teal me-2"></i> Your Fresh Basket
      </h5>
      <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column">
      <!-- Free Shipping Tracker -->
      <div class="free-shipping-progress" id="freeShippingContainer">
        <div class="small fw-semibold" id="freeShippingText">
          Add <strong>$35.00</strong> more for <strong>FREE 30-min delivery!</strong>
        </div>
        <div class="progress-bar-teal">
          <div class="progress-bar-teal-fill" id="freeShippingProgressFill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Cart Item List -->
      <div id="cartDrawerItemsList" class="flex-grow-1 overflow-y-auto">
        <!-- Rendered dynamically -->
      </div>

      <!-- Cart Subtotal & Checkout -->
      <div class="border-top pt-3 mt-auto">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="text-secondary">Estimated Subtotal:</span>
          <span class="font-heading fw-bold fs-4 text-dark" id="cartDrawerSubtotal">$0.00</span>
        </div>
        <p class="text-secondary small mb-3">Taxes and bottle deposits calculated at checkout.</p>
        <button class="btn btn-primary-teal w-100 py-3 fw-bold fs-6" id="cartCheckoutBtn"
          onclick="window.location.href='404.html'">
          Proceed to Checkout <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       OFFCANVAS: MOBILE NAVIGATION DRAWER
       ========================================================================== -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenuDrawer" aria-labelledby="mobileMenuDrawerLabel">
    <div class="offcanvas-header border-bottom">
      <a href="index.html" class="brand-logo-link" aria-label="STACKLY Organic Grocery">
        <img src="assets/images/logo.webp" alt="STACKLY Organic Grocery" class="brand-logo-img mobile-logo-img"
          width="135" height="40">
      </a>
      <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <h6 class="text-uppercase text-teal fw-bold small mb-3">Navigation</h6>
      <ul class="nav flex-column gap-2 mb-4">
        <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="index.html"><i
              class="bi bi-house me-2"></i> Home</a></li>
        <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="about.html"><i
              class="bi bi-info-circle me-2"></i> About Us</a></li>
        <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="service%20page.html"><i
              class="bi bi-gear-wide-connected me-2"></i> Services</a></li>
        <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="blog.html"><i
              class="bi bi-journal-text me-2"></i> Blog</a></li>
        <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="contact.html"><i
              class="bi bi-telephone me-2"></i> Contact</a></li>
        <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="login.html"><i
              class="bi bi-person-circle me-2"></i> Account / Sign In</a></li>
        <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="signup.html"><i
              class="bi bi-person-plus me-2"></i> Sign Up</a></li>
      </ul>
    </div>
  </div>

  <!-- CDN SCRIPTS: Bootstrap 5.3, GSAP 3, ScrollTrigger, AOS -->
    <!-- Lenis Smooth Scroll -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

  <!-- Application Modules -->
  <script src="assets/js/products.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/interactions.js"></script>
  <script src="assets/js/main.js"></script>

</body>

</html>
